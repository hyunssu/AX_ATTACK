#version: '3.8'

services:
  # 0. 프론트엔드 빌드 (React, 한 번 실행되고 종료됨)
  frontend-build:
    image: node:20-alpine
    container_name: local_frontend_build
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./nginx/html:/app/dist_out
    command: sh -c "npm install && npm run build && rm -rf dist_out/* && cp -r dist/. dist_out/"

  # 1. 백엔드 서버 (FastAPI)
  backend:
    image: python:3.11-slim
    container_name: local_backend
    restart: always
    volumes:
      - ./backend_app:/app
    working_dir: /app
    command: bash -c "pip install fastapi uvicorn pydantic psycopg2-binary minio python-multipart sqlalchemy langchain langchain-openai langchain-community pypdf pyjwt bcrypt requests && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    # FastAPI 코드가 Lightsail로 찾아갈 수 있게 주소표(환경변수)를 .env에서 읽어옴
    env_file:
      - .env

  # 2. 웹 서버 (Nginx)
  nginx:
    image: nginx:alpine
    container_name: local_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
